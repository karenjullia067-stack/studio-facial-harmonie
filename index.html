<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmonie Lux | Inteligência Estética</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --satin: #f8c8dc; --gold: #d4af37; --dark: #050505; }
        body { font-family: 'Montserrat', sans-serif; background: var(--dark); color: white; }
        .font-luxury { font-family: 'Cinzel', serif; }
        .gold-gradient { background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .satin-btn { background: linear-gradient(135deg, #f8c8dc 0%, #f1a7c4 100%); color: black; transition: 0.3s; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 25px; }
        .chip { cursor: pointer; padding: 10px 15px; border-radius: 50px; border: 1px solid #444; font-size: 10px; transition: 0.3s; text-align: center; }
        .chip.active { background: #f1a7c4; color: black; border-color: white; font-weight: bold; }
        input, select { background: rgba(255,255,255,0.05)!important; border: none!important; border-bottom: 1px solid #333!important; color: white!important; padding: 12px!important; width: 100%; border-radius: 10px; margin-bottom: 15px; }
    </style>
</head>
<body class="pb-10">

    <nav class="p-10 text-center">
        <h1 class="text-3xl font-luxury gold-gradient tracking-[0.4em]">HARMONIE</h1>
        <p class="text-[8px] tracking-[0.5em] text-pink-300 mt-2 uppercase">Elite Aesthetic Technology</p>
    </nav>

    <main class="max-w-xl mx-auto px-6">
        
        <div id="step-1">
            <div class="glass p-6 mb-6">
                <input type="text" id="nome" placeholder="NOME COMPLETO">
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="idade" placeholder="IDADE">
                    <select id="habito-agua">
                        <option value="Baixa">Água: Baixa</option>
                        <option value="Ideal">Água: Ideal</option>
                    </select>
                </div>
            </div>

            <div class="glass p-6 mb-6 text-center">
                <h3 class="text-xs gold-gradient font-luxury mb-4 uppercase">Mapeamento Fotográfico</h3>
                <div class="relative border-2 border-dashed border-pink-900 rounded-2xl p-4 h-40 flex items-center justify-center overflow-hidden">
                    <input type="file" id="foto" accept="image/*" onchange="previewFoto(event)" class="absolute inset-0 opacity-0 z-10">
                    <img id="img-preview" class="hidden w-full h-full object-cover rounded-xl">
                    <p id="txt-upload" class="text-[9px] text-pink-200">CLIQUE PARA TIRAR FOTO OU SUBIR</p>
                </div>
            </div>

            <div class="glass p-6 mb-6">
                <h3 class="text-xs text-center mb-4 uppercase tracking-widest text-pink-200">Áreas de Interesse</h3>
                <div class="grid grid-cols-3 gap-2">
                    <div class="chip" onclick="this.classList.toggle('active')">Papada</div>
                    <div class="chip" onclick="this.classList.toggle('active')">Abdômen</div>
                    <div class="chip" onclick="this.classList.toggle('active')">Glúteos</div>
                    <div class="chip" onclick="this.classList.toggle('active')">Flacidez</div>
                    <div class="chip" onclick="this.classList.toggle('active')">Celulite</div>
                    <div class="chip" onclick="this.classList.toggle('active')">Olheiras</div>
                </div>
            </div>

            <button onclick="processar()" class="w-full satin-btn p-5 rounded-full font-bold uppercase tracking-widest text-[10px] shadow-lg">
                Iniciar Diagnóstico IA
            </button>
        </div>

        <div id="step-2" class="hidden">
            <div id="dossie-pdf" class="bg-white text-black p-8 rounded-[30px] border-[8px] border-double border-pink-100">
                <h2 class="font-luxury text-center text-xl mb-1">DOSSIÊ HARMONIE</h2>
                <p class="text-[7px] text-center uppercase tracking-tighter text-gray-400 mb-6">Relatório de Alta Performance Estética</p>
                
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="text-center">
                        <p class="text-[7px] font-bold uppercase mb-1">Captura Original</p>
                        <img id="pdf-img-orig" class="w-full h-32 object-cover rounded-lg border">
                    </div>
                    <div class="text-center relative">
                        <p class="text-[7px] font-bold uppercase mb-1 text-pink-600">Projeção IA</p>
                        <img id="pdf-img-simu" class="w-full h-32 object-cover rounded-lg border-2 border-pink-300 contrast-125 saturate-150">
                        <div class="absolute bottom-2 right-2 bg-pink-500 text-white text-[5px] px-1 rounded">SIMULAÇÃO</div>
                    </div>
                </div>

                <div id="resultado-texto" class="text-[10px] space-y-3 leading-relaxed">
                    </div>
            </div>

            <div class="mt-6 space-y-3">
                <button onclick="baixarPDF()" class="w-full bg-white/10 p-4 rounded-full text-[9px] uppercase tracking-widest border border-white/20">
                    📥 Guardar Dossiê (PDF)
                </button>
                <a id="btn-whats" href="#" target="_blank" class="block w-full satin-btn p-5 rounded-full text-center font-bold text-[10px] uppercase tracking-widest">
                    💬 Agendar com Especialista
                </a>
            </div>
        </div>
    </main>

    <script>
        let fotoData = "";

        function previewFoto(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const output = document.getElementById('img-preview');
                output.src = reader.result;
                output.classList.remove('hidden');
                document.getElementById('txt-upload').classList.add('hidden');
                fotoData = reader.result;
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        function processar() {
            const nome = document.getElementById('nome').value;
            const areas = Array.from(document.querySelectorAll('.chip.active')).map(x => x.innerText);
            
            if(!nome || !fotoData) return alert("Por favor, preencha o seu nome e suba uma foto.");

            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');
            
            document.getElementById('pdf-img-orig').src = fotoData;
            document.getElementById('pdf-img-simu').src = fotoData; // Aplica filtros via CSS no PDF

            let sugestoes = "Com base na análise de tecidos, recomendamos protocolos de bioestimulação e tecnologias de remodelação. A simetria facial apresenta potencial de otimização em 15% via preenchimento estrutural.";
            
            document.getElementById('resultado-texto').innerHTML = `
                <p><b>PACIENTE:</b> ${nome.toUpperCase()}</p>
                <p><b>ÁREAS ALVO:</b> ${areas.join(', ')}</p>
                <p style="background:#fff5f8; padding:10px; border-radius:10px"><b>PARECER IA:</b> ${sugestoes}</p>
            `;

            const msg = encodeURIComponent(`Olá! Sou ${nome}. Acabei de gerar o meu Dossiê Harmonie com foto e mapeamento para ${areas.join(', ')}. Quero marcar a minha consulta!`);
            document.getElementById('btn-whats').href = `https://wa.me/5598985546758?text=${msg}`;
            window.scrollTo(0,0);
        }

        async function baixarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const nome = document.getElementById('nome').value;
            
            // Simulação de PDF de luxo
            doc.setFontSize(22);
            doc.setTextColor(212, 175, 55); // Ouro
            doc.text("HARMONIE LUX", 105, 30, {align: "center"});
            
            doc.setFontSize(10);
            doc.setTextColor(0,0,0);
            doc.text(`Relatório Individual: ${nome}`, 20, 50);
            
            if(fotoData) {
                doc.addImage(fotoData, 'JPEG', 20, 60, 80, 100);
                doc.text("FOTO ORIGINAL", 20, 165);
            }
            
            doc.setFontSize(8);
            doc.text("Este documento garante prioridade no atendimento e bónus de avaliação.", 105, 280, {align: "center"});
            
            doc.save(`Harmonie-${nome}.pdf`);
        }
    </script>
</body>
</html>
